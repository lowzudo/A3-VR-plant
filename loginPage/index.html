<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styleLogin.css">
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-div">
            <nav class="cabecalho-div-nav">
                <a href="#" class="cabecalho-div-nav-links">Home</a>
                <a href="#" class="cabecalho-div-nav-links">Report</a>
                <a href="#"><img class="cabecalho-div-nav-img" src="https://cdn.pixabay.com/photo/2023/02/18/11/00/icon-7797704_1280.png" alt="user image"></a>
            </nav>
        </div>
    </header>

    <main>
        <div class="main-div">
            <h1 class="main-div-titulo">Faça Login</h1>
            
            <form class="login-form">
                <div class="input-group">
                    <label class="main-div-text" for="vrid">VRID:</label>
                    <input class="main-div-input" id="vrid" type="text" placeholder="Digite seu VRID">
                </div>

                <div class="input-group">
                    <label class="main-div-text" for="senha">Senha:</label>
                    <input class="main-div-input" id="senha" type="password" placeholder="Digite sua senha">
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
    </main>

    <footer></footer>
</body>
</html>
